<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="width:100%; margin:0 0 24px 0; background-color:#121412; border:1px solid #2a2d2a; border-radius:6px;">
    <tr>
        <td style="padding:16px 20px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="width:100%; border-collapse:collapse;">
                <tr>
                    <td style="padding:8px 0; border-bottom:1px solid #2a2d2a; font-size:13px; color:#858b83; width:38%;">
                        Service
                    </td>
                    <td style="padding:8px 0; border-bottom:1px solid #2a2d2a; font-size:14px; color:#e7e8e3; font-weight:bold;">
                        {{ service_title }}
                    </td>
                </tr>
                <tr>
                    <td style="padding:8px 0; border-bottom:1px solid #2a2d2a; font-size:13px; color:#858b83;">
                        Provider
                    </td>
                    <td style="padding:8px 0; border-bottom:1px solid #2a2d2a; font-size:14px; color:#e7e8e3;">
                        {{ provider_name }}
                    </td>
                </tr>
                <tr>
                    <td style="padding:8px 0; border-bottom:1px solid #2a2d2a; font-size:13px; color:#858b83;">
                        Date
                    </td>
                    <td style="padding:8px 0; border-bottom:1px solid #2a2d2a; font-size:14px; color:#e7e8e3;">
                        {{ booking_date|date:"F j, Y" }}
                    </td>
                </tr>
                <tr>
                    <td style="padding:8px 0; border-bottom:1px solid #2a2d2a; font-size:13px; color:#858b83;">
                        Time
                    </td>
                    <td style="padding:8px 0; border-bottom:1px solid #2a2d2a; font-size:14px; color:#e7e8e3;">
                        {{ start_time|time:"g:i A" }} – {{ end_time|time:"g:i A" }}
                    </td>
                </tr>
                <tr>
                    <td style="padding:8px 0 0 0; font-size:13px; color:#858b83;">
                        Status
                    </td>
                    <td style="padding:8px 0 0 0; font-size:14px; color:#e7e8e3; font-weight:bold;">
                        {{ status_display }}
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
