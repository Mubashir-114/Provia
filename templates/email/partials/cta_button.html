<table role="presentation" cellpadding="0" cellspacing="0" border="0"
       style="margin:26px 0;">
    <tr>
        <td style="background-color:#b4cdb8; border-radius:2px;">
            <a href="{{ url }}"
               style="display:inline-block; padding:13px 24px; color:#111411; font-size:14px; font-weight:bold; text-decoration:none;">
                {{ label }}
            </a>
        </td>
    </tr>
</table>

{% if url %}
<p style="margin:0 0 24px 0; font-size:12px; line-height:1.6; word-break:break-all; color:#858b83;">
    Or open this link:
    <a href="{{ url }}" style="color:#dfc38f; text-decoration:none;">{{ url }}</a>
</p>
{% endif %}
