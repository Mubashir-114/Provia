<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
       style="margin:28px 0;">
    <tr>
        <td align="center">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                    <td style="background-color:#b4cdb8; border-radius:6px;">
                        <a href="{{ url }}"
                           style="display:inline-block; padding:14px 32px; color:#0d0f0d; font-size:15px; font-weight:bold; text-decoration:none; border-radius:6px;">
                            {{ label }}
                        </a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

{% if url %}
<p style="margin:0 0 24px 0; font-size:12px; line-height:1.6; word-break:break-all; color:#858b83; text-align:center;">
    Or open this link:
    <a href="{{ url }}" style="color:#dfc38f; text-decoration:none;">{{ url }}</a>
</p>
{% endif %}
