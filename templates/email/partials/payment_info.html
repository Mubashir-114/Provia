<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="width:100%; margin:0 0 8px 0; border-collapse:collapse;">
    <tr>
        <td style="padding:10px 0; border-bottom:1px solid #2a2d2a; font-size:13px; color:#858b83; width:38%;">
            Service
        </td>
        <td style="padding:10px 0; border-bottom:1px solid #2a2d2a; font-size:14px; color:#e7e8e3;">
            {{ service_title }}
        </td>
    </tr>
    <tr>
        <td style="padding:10px 0; border-bottom:1px solid #2a2d2a; font-size:13px; color:#858b83;">
            Amount
        </td>
        <td style="padding:10px 0; border-bottom:1px solid #2a2d2a; font-size:14px; color:#e7e8e3;">
            {{ amount }} {{ currency }}
        </td>
    </tr>
    <tr>
        <td style="padding:10px 0; border-bottom:1px solid #2a2d2a; font-size:13px; color:#858b83;">
            Reference
        </td>
        <td style="padding:10px 0; border-bottom:1px solid #2a2d2a; font-size:14px; color:#e7e8e3;">
            {{ payment_reference|default:"—" }}
        </td>
    </tr>
    <tr>
        <td style="padding:10px 0; border-bottom:1px solid #2a2d2a; font-size:13px; color:#858b83;">
            Status
        </td>
        <td style="padding:10px 0; border-bottom:1px solid #2a2d2a; font-size:14px; color:#e7e8e3;">
            {{ status_display }}
        </td>
    </tr>
    <tr>
        <td style="padding:10px 0; font-size:13px; color:#858b83;">
            Date
        </td>
        <td style="padding:10px 0; font-size:14px; color:#e7e8e3;">
            {{ payment_date|date:"F j, Y" }} {{ payment_date|time:"g:i A" }}
        </td>
    </tr>
</table>
