<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Provia{% endblock %}</title>
</head>

<body style="margin:0; padding:0; background-color:#0d0f0d; color:#e7e8e3; font-family:Arial,Helvetica,sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="width:100%; margin:0; padding:32px 16px; background-color:#0d0f0d;">
    <tr>
        <td align="center">

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="max-width:560px; width:100%; background-color:#151815; border:1px solid #343733;">

                <tr>
                    <td style="padding:28px 32px 22px 32px; border-bottom:1px solid #2a2d2a;">

                        <div style="font-size:13px; letter-spacing:2px; font-weight:bold; color:#dfc38f;">
                            PROVIA
                        </div>

                        {% block eyebrow %}{% endblock %}

                        <h1 style="margin:14px 0 0 0; font-size:26px; line-height:1.25; color:#f0f1ec;">
                            {% block heading %}{% endblock %}
                        </h1>

                    </td>
                </tr>

                <tr>
                    <td style="padding:30px 32px;">

                        {% block lead %}{% endblock %}

                        {% block content %}{% endblock %}

                        {% block footer_note %}{% endblock %}

                    </td>
                </tr>

                <tr>
                    <td style="padding:18px 32px; border-top:1px solid #2a2d2a;">

                        <p style="margin:0; font-size:11px; color:#6f756d;">
                            Provia Team
                        </p>

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
