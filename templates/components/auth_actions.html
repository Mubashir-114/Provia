{% if user.is_authenticated %}
<div class="flex items-center gap-3">
  {% if user.role == 'provider' %}
  <a
    href="{% url 'dashboard:provider' %}"
    class="text-sm font-semibold text-[#a4aba4] transition hover:text-[#e9ebe7]"
  >
    Dashboard
  </a>
  {% else %}
  <a
    href="{% url 'dashboard:customer' %}"
    class="text-sm font-semibold text-[#a4aba4] transition hover:text-[#e9ebe7]"
  >
    Dashboard
  </a>
  {% endif %}

  <a
    href="{% url 'accounts:profile' %}"
    class="btn btn-outline"
  >
    Profile
  </a>

  <form action="{% url 'accounts:logout' %}" method="post" class="inline">
    {% csrf_token %}
    <button
      type="submit"
      class="btn btn-danger cursor-pointer"
    >
      Logout
    </button>
  </form>
</div>
{% else %}
<div class="flex items-center gap-3">
  <a
    href="{% url 'accounts:login' %}"
    class="btn btn-ghost"
  >
    Login
  </a>
  <a
    href="{% url 'accounts:register' %}"
    class="btn btn-brass"
  >
    Register
  </a>
</div>
{% endif %}
