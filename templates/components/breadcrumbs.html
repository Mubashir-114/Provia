{% if items %}
<nav class="flex py-2 text-sm font-medium text-[var(--ink-soft)]" aria-label="Breadcrumb">
  <ol class="inline-flex items-center space-x-2 flex-wrap">
    {% for item in items %}
      {% if not forloop.first %}
        <li class="text-[var(--ink-soft)]/50 select-none">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </li>
      {% endif %}
      <li>
        {% if item.is_current or forloop.last or not item.url_name %}
          <span class="text-[var(--ink)] font-semibold" aria-current="page">{{ item.label }}</span>
        {% else %}
          <a
            href="{% if item.url_args %}{% url item.url_name item.url_args %}{% else %}{% url item.url_name %}{% endif %}"
            class="hover:text-[var(--pine)] transition"
          >
            {{ item.label }}
          </a>
        {% endif %}
      </li>
    {% endfor %}
  </ol>
</nav>
{% endif %}
