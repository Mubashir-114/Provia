<dialog id="{{ dialog_id|default:'confirm-dialog' }}" class="rounded-lg border border-[#434843] bg-[#1a1c1a] p-6 shadow-2xl max-w-md w-full backdrop:bg-black/75 backdrop:backdrop-blur-sm text-[#e2e3df]">
  <div class="flex flex-col gap-4">
    <div class="flex items-start gap-3.5">
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded border border-red-500/30 bg-red-500/10 text-[#ffb4ab]">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      <div>
        <h3 class="font-display text-lg font-bold text-[#e2e3df]">{{ title|default:"Confirm Action" }}</h3>
        <p class="text-xs sm:text-sm text-[#c3c8c1] mt-1 leading-relaxed">{{ message|default:"Are you sure you want to proceed with this action?" }}</p>
      </div>
    </div>

    <div class="mt-4 flex items-center justify-end gap-3 border-t border-[#343733] pt-4">
      <button
        type="button"
        onclick="this.closest('dialog').close()"
        class="btn btn-ghost text-xs font-mono"
      >
        Cancel
      </button>
      <form action="{{ confirm_url }}" method="post" class="inline">
        {% csrf_token %}
        <button
          type="submit"
          class="btn btn-danger text-xs font-mono font-bold uppercase tracking-wider cursor-pointer"
        >
          {{ confirm_label|default:"Confirm" }}
        </button>
      </form>
    </div>
  </div>
</dialog>
