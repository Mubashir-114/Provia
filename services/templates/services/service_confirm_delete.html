{% extends "base.html" %}
{% block title %}Delete Service — Provia{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg px-4 sm:px-6 py-12 sm:py-16">
  <div class="rounded-xl border border-[#343533] bg-[#1b1c1a] p-6 sm:p-8 text-center">
    <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 mb-4">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    </div>

    <h1 class="font-display text-2xl font-bold text-[#e9ebe7]">Delete Service</h1>
    <p class="mt-2 text-sm text-[#a4aba4] leading-relaxed">
      Are you sure you want to delete <strong class="text-[#e9ebe7]">"{{ service.title }}"</strong>?
    </p>
    <p class="mt-2 text-xs font-semibold text-red-400">
      This action is permanent and cannot be undone.
    </p>

    <form method="post" class="mt-8 border-t border-[#343533] pt-6 flex flex-wrap justify-center gap-3">
      {% csrf_token %}
      <a href="{% url 'services:list' %}" class="btn btn-outline">
        Cancel
      </a>
      <button
        type="submit"
        class="btn btn-danger"
      >
        Confirm Delete
      </button>
    </form>
  </div>
</div>
{% endblock %}
