{% extends "base.html" %}
{% block title %}Check Your Email — Provia{% endblock %}

{% block content %}
<div class="mx-auto w-full max-w-[460px] px-4 sm:px-6 py-12 sm:py-20">
  <div class="auth-card p-6 sm:p-8 text-center shadow-2xl">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl border border-[#dfc38f]/30 bg-[#dfc38f]/10 text-[#dfc38f] mb-5 shadow-inner">
      <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
    </div>

    <h1 class="font-display text-2xl font-bold tracking-tight text-[#e9ebe7]">Check Your Email</h1>
    <p class="mt-2 text-sm text-[#a4aba4] leading-relaxed">
      If an account exists with that email address, we have sent instructions to reset your password.
    </p>

    <div class="mt-8 border-t border-[#343533] pt-6">
      <a
        href="{% url 'accounts:login' %}"
        class="btn btn-brass w-full py-3 text-sm font-semibold rounded-xl tracking-wide shadow-md transition duration-150"
      >
        Return to Login
      </a>
    </div>
  </div>
</div>
{% endblock %}
