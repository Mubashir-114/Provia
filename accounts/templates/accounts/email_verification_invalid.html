{% extends "base.html" %}
{% block title %}Invalid Link — Provia{% endblock %}

{% block content %}
<div class="mx-auto w-full max-w-[460px] px-4 sm:px-6 py-12 sm:py-20">
  <div class="auth-card p-6 sm:p-8 text-center shadow-2xl">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl border border-red-500/30 bg-red-500/10 text-red-400 mb-5 shadow-inner">
      <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>

    <h1 class="font-display text-2xl font-bold tracking-tight text-[#e9ebe7]">Invalid Verification Link</h1>
    <p class="mt-2 text-sm text-[#a4aba4] leading-relaxed">
      This email verification link is invalid or has expired.
    </p>

    <div class="mt-8 border-t border-[#343533] pt-6 flex flex-col gap-3">
      <a
        href="{% url 'accounts:resend_verification' %}"
        class="btn btn-brass w-full py-3 text-sm font-semibold rounded-xl tracking-wide shadow-md transition duration-150"
      >
        Request New Link
      </a>
      <a
        href="{% url 'accounts:login' %}"
        class="text-xs font-semibold text-[#a4aba4] hover:text-[#e9ebe7] transition-colors mt-1"
      >
        Back to Login
      </a>
    </div>
  </div>
</div>
{% endblock %}
