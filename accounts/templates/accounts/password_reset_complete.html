{% extends "base.html" %}
{% block title %}Password Changed — Provia{% endblock %}

{% block content %}
<div class="mx-auto w-full max-w-[460px] px-4 sm:px-6 py-12 sm:py-20">
  <div class="auth-card p-6 sm:p-8 text-center shadow-2xl">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl border border-[#b4cdb8]/30 bg-[#b4cdb8]/10 text-[#b4cdb8] mb-5 shadow-inner">
      <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>

    <h1 class="font-display text-2xl font-bold tracking-tight text-[#e9ebe7]">Password Changed Successfully</h1>
    <p class="mt-2 text-sm text-[#a4aba4] leading-relaxed">
      Your password has been updated. You can now log in with your new password.
    </p>

    <div class="mt-8 border-t border-[#343533] pt-6">
      <a
        href="{% url 'accounts:login' %}"
        class="btn btn-brass w-full py-3 text-sm font-semibold rounded-xl tracking-wide shadow-md transition duration-150"
      >
        Sign In to Your Account
      </a>
    </div>
  </div>
</div>
{% endblock %}
